# Stage 1: SFT on the pretrained base model.
model_name_or_path: Qwen/Qwen2.5-1.5B   # base (non-Instruct) checkpoint on purpose — see training/README.md
dataset_path: training/datasets/sft.jsonl
output_dir: training/outputs/stage1_sft
max_seq_length: 2048

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  num_train_epochs: 8
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: epoch
  bf16: true
  seed: 0

# Swap for a faster/cheaper smoke test or a stronger baseline:
#   model_name_or_path: Qwen/Qwen2.5-0.5B   (fastest, lowest quality)
#   model_name_or_path: Qwen/Qwen2.5-3B     (needs ~24GB VRAM with these LoRA settings)
