# Stage 4: teach tool-calling (ReAct ) on top of the Stage-3 DPO model, using
# trajectories from training/data_gen/build_agent_trajectories.py.
model_name_or_path: training/outputs/stage3_dpo_merged   # full weights (LoRA already folded in by train_dpo.py)
dataset_path: training/datasets/agent_sft.jsonl
output_dir: training/outputs/stage4_agent
max_seq_length: 3072   # trajectories embed tool-schema JSON + Observation payloads, longer than plain reports

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.5e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 5
  save_strategy: epoch
  bf16: true
  seed: 0
